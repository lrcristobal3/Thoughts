 <!DOCTYPE html>

<html>

<head>
    <title>Thoughts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Main-->
    <div class="main">
        
        <!--Main Box-->
        <div class="menu">
            
            <!--Left Side-->
            <div class="cover">
                
                <!--Title-->
                <div class="icon">
                    <h1 class="logo"><del><sup>Hide</sup></del>Send Your Thoughts</h1>
                </div>
                
                <!--Buttons-->
                <div class="view">
                    <button class="scroll">Explore</button>
                    <button class="search">Search</button>
                </div>
                
            </div>
            
            <!--Right Side-->
            <div class="thoughts">
                
                <!--Title-->
                <div class="send_title">
                    <h1 class="just_send">Just Send It!</h1>
                </div>
                
                <!--Text Box-->
                <div class="type_text">
                    <textarea class="text" placeholder="Type your thoughts here..."></textarea>
                    <input type="text" class="send_to" placeholder="To:">
                </div>
                
                <!--Button-->
                <div class="button_text">
                    <button class="send_button">Send</button>
                </div>
                
            </div>
        </div>
    </div>


    
</body>

</html>
